<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Горячо–холодно: поиск клада</title>
<style>
:root{
  --bg:#1cd3a2; --panel:#FBF4E4; --ink:#2A3A2C; --muted:#6B6A55;
  --hot:#C9402A; --warm:#E8703F; --mild:#F2B33D; --cool:#8DBF9C; --cold:#2F6B3F; --deep:#1F4A2B;
  --empty:#EADBB8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:20px 14px}
main{width:100%;max-width:520px}
h1{font-size:2rem;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 16px;line-height:1.45}
.bar{display:flex;gap:10px;margin-bottom:12px}
.stat{flex:1;background:var(--panel);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:1.6rem;line-height:1.1}
.stat span{font-size:.85rem;color:var(--muted)}
#msg{min-height:64px;border-radius:14px;padding:12px 14px;margin-bottom:12px;background:var(--panel);font-size:1.15rem;line-height:1.35;border-left:10px solid var(--empty);transition:border-color .2s}
#msg small{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}
#grid{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;background:var(--panel);padding:8px;border-radius:18px}
.c{aspect-ratio:1;border:0;border-radius:7px;background:var(--empty);cursor:pointer;font-family:Arial,Helvetica,sans-serif;font-size:1.1rem;color:#fff;transition:transform .12s}
.c:hover:not(:disabled){transform:scale(1.07)}
.c:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.c:disabled{cursor:default}
.c.hot{background:var(--hot)} .c.warm{background:var(--warm)} .c.mild{background:var(--mild);color:#4a3406}
.c.cool{background:var(--cool);color:#16361f} .c.cold{background:var(--cold)} .c.win{outline:3px solid var(--mild)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin:12px 2px;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}
button.btn{width:100%;padding:13px;border:0;border-radius:14px;background:var(--hot);color:#fff;font-family:Arial,Helvetica,sans-serif;font-size:1.05rem;cursor:pointer}
button.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#result{display:none;margin-bottom:12px;background:var(--panel);border-radius:18px;padding:16px;text-align:center}
#result .big{font-size:3.4rem;line-height:1;font-weight:bold;color:var(--hot)}
#result .rank{font-size:1.2rem;margin-top:4px}

.c.win{background:#6b5a4a center/cover no-repeat;font-size:0}
#result img{width:110px;height:110px;object-fit:cover;border-radius:50%;border:4px solid var(--mild);margin-bottom:8px}
.nick{display:flex;gap:8px;margin-bottom:12px}
.nick input{flex:1;padding:11px 12px;border-radius:12px;border:2px solid var(--empty);background:var(--panel);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:1rem}
.lb{background:var(--panel);border-radius:18px;padding:12px 14px;margin-top:16px}
.lb h2{font-size:1.15rem;margin:0 0 8px}
.lb ol{margin:0;padding:0;list-style:none}
.lb li{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--empty)}
.lb li:first-child{border-top:0}
.lb .pos{width:24px;color:var(--muted)}
.lb .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .sc{font-weight:bold;color:var(--hot)}
.lb li.me .nm{font-weight:bold}
.lb p{margin:0;color:var(--muted);font-size:.9rem}
#lbBody{max-height:440px;overflow-y:auto}
</style>
</head>
<body>
<main>
  <h1>Найди клад</h1>
  <p class="sub">Клад — песик, он спрятался в случайной клетке. Нажимай на клетки: игра подскажет, горячо или холодно. Чем меньше попыток, тем круче результат.</p>

  </div>

</main>
<script>
(function(){
  var N=12; // результат = число попыток, чем меньше, тем лучше
  var grid=document.getElementById('grid'), msg=document.getElementById('msg');
  var triesEl=document.getElementById('tries'), bestEl=document.getElementById('best');
  var result=document.getElementById('result'), scoreEl=document.getElementById('score'), rankEl=document.getElementById('rank');
  var FERRET=document.getElementById('ferret').src;
  var nick=document.getElementById('nick'), lbBody=document.getElementById('lbBody');
  try{nick.value=localStorage.getItem('treasure_nick')||'';}catch(e){}
  var tx,ty,tries,prev,over,best=null;
  try{var b=localStorage.getItem('treasure_best_tries'); if(b!==null&&b!=='') best=parseInt(b,10);}catch(e){}

  function showBest(){bestEl.textContent=(best===null||isNaN(best))?'–':best}
  function band(d){
    if(d<=2) return {c:'hot',t:'Горячо! 🔥',k:'#C9402A'};
    if(d<=4.5) return {c:'warm',t:'Тепло',k:'#E8703F'};
    if(d<=7) return {c:'mild',t:'Не очень тепло',k:'#F2B33D'};
    if(d<=10) return {c:'cool',t:'Прохладно',k:'#8DBF9C'};
    return {c:'cold',t:'Холодно ❄️',k:'#2F6B3F'};
  }
  function rankName(t){
    if(t<=6) return 'Легенда: почти телепат!';
    if(t<=12) return 'Отличный следопыт';
    if(t<=20) return 'Опытный искатель';
    if(t<=35) return 'Неплохо, но можно лучше';
    if(t<=60) return 'Песик найден, не без труда';
    return 'Главное — песик найден';
  }
  function start(){
    tx=Math.floor(Math.random()*N); ty=Math.floor(Math.random()*N);
    tries=0; prev=null; over=false;
    triesEl.textContent=0;
    msg.innerHTML='Выбери любую клетку, чтобы начать.'; msg.style.borderLeftColor='';
    result.style.display='none';
    grid.innerHTML='';
    for(var y=0;y<N;y++)for(var x=0;x<N;x++){
      var b=document.createElement('button');
      b.className='c'; b.dataset.x=x; b.dataset.y=y;
      b.setAttribute('aria-label','Клетка '+(y+1)+'-'+(x+1));
      grid.appendChild(b);
    }
  }
  grid.addEventListener('click',function(e){
    var b=e.target.closest('.c'); if(!b||over||b.disabled) return;
    var x=+b.dataset.x,y=+b.dataset.y;
    tries++; triesEl.textContent=tries;
    var d=Math.sqrt((x-tx)*(x-tx)+(y-ty)*(y-ty));
    b.disabled=true;
    if(d===0){
      over=true; b.className='c win'; b.style.backgroundImage='url('+FERRET+')'; b.textContent='';
      var s=tries;
      msg.innerHTML='Песик найден за '+tries+' '+plural(tries)+'!'; msg.style.borderLeftColor='#F2B33D';
      scoreEl.textContent=s+' '+pn(s); rankEl.textContent=rankName(s);
      result.style.display='block';
      submit(s);
      if(best===null||isNaN(best)||s<best){best=s; try{localStorage.setItem('treasure_best_tries',String(s));}catch(e){} showBest();}
      return;
    }
    var r=band(d); b.className='c '+r.c;
    var trend='';
    if(prev!==null){ trend = d<prev ? 'Теплее, чем в прошлый раз' : d>prev ? 'Холоднее, чем в прошлый раз' : 'Так же, как в прошлый раз'; }
    prev=d;
    msg.innerHTML=r.t+(trend?'<small>'+trend+'</small>':''); msg.style.borderLeftColor=r.k;
  });
  function pn(n){var m=n%10,k=n%100; if(m===1&&k!==11) return 'попытка'; if(m>=2&&m<=4&&(k<12||k>14)) return 'попытки'; return 'попыток';}
  function plural(n){var m=n%10,h=n%100; if(m===1&&h!==11) return 'попытку'; if(m>=2&&m<=4&&(h<12||h>14)) return 'попытки'; return 'попыток';}
  document.getElementById('again').addEventListener('click',start);
  showBest(); start();
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  // ===== Настройки базы данных (Supabase) =====
  var SUPABASE_URL = 'https://zdvkdleeiuopjtjutaum.supabase.co';   // например: https://xxxx.supabase.co
  var SUPABASE_KEY = 'sb_publishable_5U__4qiFa4e_Jh3biQ3TQw_4HHeQpBk';   // anon public key из Project Settings → API
  // =============================================
  var pid=null;
  try{pid=localStorage.getItem('treasure_pid'); if(!pid){pid='p'+Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem('treasure_pid',pid);}}catch(e){pid='p'+Math.random().toString(36).slice(2);}
  function hdr(){var o={'apikey':SUPABASE_KEY,'Content-Type':'application/json'}; if(SUPABASE_KEY.indexOf('eyJ')===0) o['Authorization']='Bearer '+SUPABASE_KEY; return o;}
  function renderLb(rows){
    if(!rows.length){lbBody.innerHTML='<p>Пока никого нет. Стань первым!</p>';return;}
    var html='<ol>';
    rows.forEach(function(v,i){html+='<li'+(v.pid===pid?' class="me"':'')+'><span class="pos">'+(i+1)+'</span><span class="nm">'+esc(v.name||'Игрок')+'</span><span class="sc">'+(v.tries|0)+' поп.</span></li>';});
    lbBody.innerHTML=html+'</ol>';
  }
  async function loadLb(){
    if(!SUPABASE_URL||!SUPABASE_KEY){lbBody.innerHTML='<p>База данных не подключена: впиши SUPABASE_URL и SUPABASE_KEY в начале скрипта.</p>';return;}
    try{
      var r=await fetch(SUPABASE_URL+'/rest/v1/treasure_results?select=pid,name,tries&order=tries.asc,updated_at.asc&limit=100',{headers:hdr()});
      if(!r.ok) throw new Error(r.status);
      renderLb(await r.json());
    }catch(e){lbBody.innerHTML='<p>Рейтинг сейчас недоступен.</p>';}
  }
  async function submit(s){
    var name=(nick.value||'').trim().slice(0,16)||'Игрок';
    try{localStorage.setItem('treasure_nick',name);}catch(e){}
    if(!SUPABASE_URL||!SUPABASE_KEY) return;
    try{
      await fetch(SUPABASE_URL+'/rest/v1/rpc/treasure_submit_result',{method:'POST',headers:hdr(),body:JSON.stringify({p_pid:pid,p_name:name,p_tries:s})});
    }catch(e){}
    loadLb();
  }
  loadLb();
})();
</script>
